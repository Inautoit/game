name = "verisure-clientes"
main = "src/index.js"
compatibility_date = "2026-09-01"

# La interfaz (HTML/CSS/JS) se sirve como archivos estáticos; el Worker sólo
# atiende las rutas /api/*.
[assets]
directory = "./public"

[observability]
enabled = true

# Base de datos D1. Rellena database_id con el que devuelve:
#   npx wrangler d1 create verisure-clientes
[[d1_databases]]
binding = "DB"
database_name = "verisure-clientes"
database_id = "PENDIENTE_DE_CREAR"
