<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 232" role="img" aria-label="Escudo del club">
  <title>Escudo del club</title>
  <defs>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4dff"/>
      <stop offset="1" stop-color="#0a0a9e"/>
    </linearGradient>
    <path id="silueta" d="M12 10h176v104c0 62-52 92-88 108C64 206 12 176 12 114Z"/>
    <clipPath id="recorte"><use href="#silueta"/></clipPath>
    <path id="estrella" d="M0-8 2.3-2.7 8-2.1 3.7 1.8 4.9 7.4 0 4.5-4.9 7.4-3.7 1.8-8-2.1-2.3-2.7Z"/>
  </defs>

  <use href="#silueta" fill="url(#cuerpo)" stroke="#050538" stroke-width="8"/>

  <g clip-path="url(#recorte)">
    <!-- franja superior más clara -->
    <rect x="12" y="10" width="176" height="88" fill="#8f9bff" opacity=".55"/>
    <text x="100" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" fill="#fff" letter-spacing="1">BALONMANO</text>
    <text x="100" y="84" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" font-style="italic" fill="#fff" letter-spacing="1">LEGANÉS</text>

    <!-- siete estrellas de la Comunidad de Madrid -->
    <g fill="#c3cbff">
      <use href="#estrella" x="112" y="120"/>
      <use href="#estrella" x="134" y="120"/>
      <use href="#estrella" x="156" y="120"/>
      <use href="#estrella" x="178" y="120"/>
      <use href="#estrella" x="123" y="144"/>
      <use href="#estrella" x="145" y="144"/>
      <use href="#estrella" x="167" y="144"/>
    </g>

    <!-- campo blanco con las ondas del escudo de la ciudad -->
    <g transform="translate(38 112)">
      <path d="M0 0h62v42c0 22-19 33-31 39C19 75 0 64 0 42Z" fill="#fff" opacity=".9"/>
      <g stroke="#1a2bd8" stroke-width="4.5" stroke-linecap="round" fill="none">
        <path d="M11 20q10-8 20 0t20 0"/>
        <path d="M11 36q10-8 20 0t20 0"/>
        <path d="M14 52q9-7 17 0t17 0"/>
      </g>
    </g>
  </g>
</svg>
