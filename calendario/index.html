<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a1442" />
<meta name="description" content="Calendario de entrenamientos y partidos del equipo. Consulta pública, edición protegida por contraseña." />
<title>Calendario del equipo · BM Leganés</title>
<link rel="icon" href="./assets/escudo.svg" />
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Calendario" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img class="escudo" src="./assets/escudo.svg" alt="Escudo del club" width="52" height="60" />
    <div class="brand-text">
      <h1 id="equipo">Balonmano Leganés</h1>
      <p id="subtitulo">Pretemporada · Segunda Infantil Femenino</p>
    </div>
  </div>

  <div class="topbar-actions">
    <span id="badge-editor" class="badge" hidden>Modo edición</span>
    <button id="btn-editar" class="btn btn-ghost" type="button">Editar</button>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Vistas del calendario">
  <button class="tab is-active" type="button" role="tab" aria-selected="true"  data-view="hoy">Hoy</button>
  <button class="tab"           type="button" role="tab" aria-selected="false" data-view="semana">Semana</button>
  <button class="tab"           type="button" role="tab" aria-selected="false" data-view="mes">Mes</button>
  <button class="tab"           type="button" role="tab" aria-selected="false" data-view="partidos">Partidos</button>
  <button class="tab"           type="button" role="tab" aria-selected="false" data-view="fotos">Fotos</button>
</nav>

<main id="vista" class="vista" aria-live="polite"></main>

<footer class="pie">
  <p>Actualizado: <span id="actualizado">—</span></p>
  <p class="pie-nota">Calendario público. Solo el entrenador puede modificarlo.</p>
</footer>

<!-- Panel de un día -->
<div id="panel" class="overlay" hidden>
  <div class="hoja" role="dialog" aria-modal="true" aria-labelledby="panel-titulo">
    <div class="hoja-cab">
      <h2 id="panel-titulo">Día</h2>
      <button class="cerrar" type="button" data-cerrar aria-label="Cerrar">&times;</button>
    </div>
    <div id="panel-cuerpo" class="hoja-cuerpo"></div>
  </div>
</div>

<!-- Diálogo genérico: contraseña, formularios, confirmaciones -->
<div id="modal" class="overlay" hidden>
  <div class="hoja hoja-corta" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="hoja-cab">
      <h2 id="modal-titulo">—</h2>
      <button class="cerrar" type="button" data-cerrar aria-label="Cerrar">&times;</button>
    </div>
    <div id="modal-cuerpo" class="hoja-cuerpo"></div>
  </div>
</div>

<!-- Visor de una foto a pantalla completa -->
<div id="visor" class="visor" hidden>
  <div class="visor-barra">
    <span id="visor-pie" class="visor-pie"></span>
    <div class="visor-acciones">
      <a id="visor-descargar" class="btn btn-small" download>Descargar</a>
      <button id="visor-borrar" class="btn btn-small btn-danger" type="button" hidden>Borrar</button>
      <button class="cerrar" type="button" data-cerrar-visor aria-label="Cerrar">&times;</button>
    </div>
  </div>
  <img id="visor-img" class="visor-img" alt="" />
</div>

<div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

<script src="./src/config.js"></script>
<script src="./src/seed.js"></script>
<script src="./src/sha256.js"></script>
<script src="./src/api.js"></script>
<script src="./src/store.js"></script>
<script src="./src/auth.js"></script>
<script src="./src/fotos.js"></script>
<script src="./src/app.js"></script>
</body>
</html>
