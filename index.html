<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Corte Perfecto ✂️</title>
  <meta name="description" content="¿Eres capaz de cortar en dos mitades exactas? Un reto nuevo cada día. Partidas de 30 segundos.">
  <meta name="theme-color" content="#ff8a65">

  <!-- Al compartir el enlace (WhatsApp, redes...) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Corte Perfecto ✂️ ¿Puedes cortar 50/50?">
  <meta property="og:description" content="Corta frutas, tartas y más en dos mitades exactas. Reto diario, partidas de 30 segundos.">
  <meta property="og:image" content="og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Instalable en la pantalla de inicio -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Corte Perfecto">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="pill"><span class="label">PUNTOS</span><b id="score">0</b></div>
    <div class="pill"><b id="round">1/10</b></div>
    <div id="combo" class="pill combo hidden">🔥 x<b id="comboN">2</b></div>
  </div>

  <!-- Menú -->
  <div id="menu" class="overlay">
    <div class="card">
      <div class="logo">✂️</div>
      <h1>CORTE<br><span>PERFECTO</span></h1>
      <p class="tagline">Corta cada cosa en <b>dos mitades exactas</b>.<br>Desliza el dedo para cortar.</p>
      <div class="streak" id="streak"></div>
      <button id="dailyBtn" class="btn">RETO DIARIO <span id="dailyN"></span></button>
      <div id="dailyDone" class="note hidden"></div>
      <button id="freeBtn" class="btn alt">PARTIDA LIBRE</button>
      <div class="row">
        <span class="note">Récord libre: <b id="best">0</b></span>
        <button id="soundBtn" class="chip">🔊</button>
      </div>
    </div>
  </div>

  <!-- Resultados -->
  <div id="results" class="overlay hidden">
    <div class="card">
      <h2 id="resTitle">¡Muy fino!</h2>
      <div id="resMode" class="note"></div>
      <div id="resRecord" class="record hidden">✨ ¡NUEVO RÉCORD! ✨</div>
      <div class="stats">
        <div><span class="label">PUNTOS</span><b id="resScore">0</b></div>
        <div><span class="label">PRECISIÓN</span><b id="resPrec">0 %</b></div>
      </div>
      <div id="resGrid" class="grid"></div>
      <div id="resBest" class="note"></div>
      <button id="shareBtn" class="btn">COMPARTIR 📤</button>
      <button id="againBtn" class="btn alt">OTRA PARTIDA</button>
      <button id="menuBtn" class="btn ghost">MENÚ</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="src/game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
