<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1020" />
  <title>Garaje 3D · Tuning</title>
  <link rel="stylesheet" href="./styles.css" />

  <!-- Three.js vendorizado (sin CDN): funciona offline y directo en el navegador -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- Cabecera -->
  <header id="topbar">
    <div class="brand">🏎️ <strong>Garaje&nbsp;3D</strong> <span>Tuning Studio</span></div>
    <div class="hint">Arrastra para girar · rueda o pellizca para zoom</div>
  </header>

  <!-- Botón para mostrar/ocultar el panel (móvil) -->
  <button id="panel-toggle" aria-label="Panel de tuning">🔧</button>

  <!-- Panel de tuning (se rellena desde ui.js) -->
  <aside id="panel"></aside>

  <!-- Aviso flotante -->
  <div id="toast"></div>

  <!-- Pantalla de carga -->
  <div id="loading">
    <div class="spinner"></div>
    <p>Preparando el garaje…</p>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
