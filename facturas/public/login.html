<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · C&amp;M Facturas</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/img/favicon-64.png">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1f5fae">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="C&amp;M Facturas">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="login-wrap">
    <div class="card login">
      <img class="login-logo" src="/static/img/logo.png" alt="C&amp;M Instalaciones Eléctricas">
      <h1>Facturas</h1>
      <p class="muted" style="margin-top:0">Entra con tu correo y tu contraseña.</p>

      <div id="error" class="alert error hidden"></div>

      <div id="ms-block" class="hidden">
        <a class="btn" href="/auth/microsoft">
          <svg class="ms-logo" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
          Iniciar sesión con Microsoft (Outlook)
        </a>
        <div class="divider">o con tu correo y contraseña</div>
      </div>

      <form id="form" class="grid">
        <p id="setup-info" class="alert info hidden" style="margin:0">Primera vez: crea tu contraseña. Necesitas el <strong>código de activación</strong> que te dieron al instalar la app.</p>
        <label>Correo electrónico
          <input type="email" name="email" autocomplete="username" required placeholder="tu@correo.com">
        </label>
        <label>Contraseña
          <input type="password" name="password" autocomplete="current-password" required minlength="8">
        </label>
        <label id="code-field" class="hidden">Código de activación
          <input name="code" autocomplete="off">
        </label>
        <button class="btn primary" type="submit">Entrar</button>
      </form>
    </div>
  </div>
  <script src="/static/login.js"></script>
</body>
</html>
