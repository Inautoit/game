<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C&amp;M Facturas</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/img/favicon-64.png">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1f5fae">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="C&amp;M Facturas">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><img src="/static/img/logo.png" alt="C&amp;M Instalaciones Eléctricas"><span>Facturas</span></a>
    <nav>
      <a href="#/" data-nav="inicio">Inicio</a>
      <a href="#/facturas" data-nav="facturas">Facturas</a>
      <a href="#/presupuestos" data-nav="presupuestos">Presupuestos</a>
      <a href="#/clientes" data-nav="clientes">Clientes</a>
      <a href="#/productos" data-nav="productos">Productos</a>
      <a href="#/ajustes" data-nav="ajustes">Ajustes</a>
    </nav>
    <div class="user">
      <span id="user-email" class="hide-sm"></span>
      <button class="btn sm" id="logout">Salir</button>
    </div>
  </header>

  <main id="app"></main>

  <!-- Diálogo genérico -->
  <dialog id="dialog">
    <form method="dialog" id="dialog-form">
      <div class="d-head"><h2 id="dialog-title"></h2><button class="btn ghost sm" value="cancel" formnovalidate aria-label="Cerrar">✕</button></div>
      <div class="d-body" id="dialog-body"></div>
      <div class="d-foot" id="dialog-foot"></div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/vendor/pdf-lib.min.js"></script>
  <script src="/static/pdf.js"></script>
  <script src="/static/voice.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
