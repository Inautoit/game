<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Gestores</title>
  <meta name="description" content="Llamadas entrantes, salientes, automarcador y estados por gestor, en tiempo real.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M8 22V13M14 22V9M20 22v-6M26 22V11' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="chart.umd.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- ======== LOGIN ======== -->
  <section id="login" class="login" hidden>
    <form id="form-login" class="login-caja">
      <h1>Dashboard Gestores</h1>
      <p class="muted">Introduce la clave de acceso.</p>
      <label for="clave">Clave</label>
      <input id="clave" name="clave" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Entrar</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <!-- ======== DASHBOARD ======== -->
  <div id="app" hidden>
    <header class="cabecera">
      <div>
        <h1>Dashboard Gestores</h1>
        <p class="muted" id="subtitulo">Cargando…</p>
      </div>
      <div class="cabecera-acciones">
        <span id="refresco" class="muted pequeno"></span>
        <button id="tema" class="boton-sec" type="button" title="Cambiar tema claro/oscuro">◐</button>
        <button id="salir" class="boton-sec" type="button">Salir</button>
      </div>
    </header>

    <div id="frescura" class="frescura" aria-label="Última actualización de cada informe"></div>
    <div id="aviso" class="aviso" hidden></div>

    <section class="kpis" id="kpis" aria-label="Resumen del día"></section>

    <section class="graficos">
      <figure class="tarjeta">
        <figcaption>
          <h2>Entrantes por franja</h2>
          <p class="muted pequeno">Llamadas de cola (00.Servicio OP.Comerciales)</p>
        </figcaption>
        <div class="lienzo"><canvas id="g-entrantes" role="img" aria-label="Gráfico de llamadas entrantes por franja de 30 minutos"></canvas></div>
      </figure>
      <figure class="tarjeta">
        <figcaption>
          <h2>Salientes por franja</h2>
          <p class="muted pequeno">Salientes de gestor (Agent Group + Skill) y registros del automarcador</p>
        </figcaption>
        <div class="lienzo"><canvas id="g-salientes" role="img" aria-label="Gráfico de llamadas salientes por franja de 30 minutos"></canvas></div>
      </figure>
    </section>

    <section class="tarjeta">
      <div class="pestanas" role="tablist">
        <button role="tab" aria-selected="true" data-pestana="gestores">Gestores</button>
        <button role="tab" aria-selected="false" data-pestana="colas">Colas entrantes</button>
        <button role="tab" aria-selected="false" data-pestana="campanas">Automarcador</button>
      </div>

      <div data-panel="gestores">
        <div class="filtros">
          <input id="buscar" type="search" placeholder="Buscar gestor o ID…" aria-label="Buscar gestor">
          <label class="check" title="Los que aparecen en Agent Group + Skill o en el Automarcador. Desmárcalo para ver a toda la plataforma (Agent State / AUX)."><input id="solo-activos" type="checkbox" checked> Solo gestores del servicio</label>
          <span class="muted pequeno" id="cuenta-gestores"></span>
          <button id="csv" class="boton-sec" type="button">Descargar CSV</button>
        </div>
        <div class="tabla-scroll"><table id="t-gestores" class="tabla"></table></div>
      </div>
      <div data-panel="colas" hidden>
        <div class="tabla-scroll"><table id="t-colas" class="tabla"></table></div>
      </div>
      <div data-panel="campanas" hidden>
        <div class="tabla-scroll"><table id="t-campanas" class="tabla"></table></div>
      </div>
    </section>

    <footer class="muted pequeno pie">
      Los datos se actualizan cada 15 minutos desde BusinessObjects. Tiempos en h:mm:ss.
    </footer>
  </div>

  <!-- ======== DETALLE DE UN GESTOR ======== -->
  <dialog id="detalle" class="detalle">
    <div class="detalle-cab">
      <div>
        <h2 id="d-nombre"></h2>
        <p class="muted pequeno" id="d-sub"></p>
      </div>
      <button class="boton-sec" type="button" id="d-cerrar" aria-label="Cerrar">✕</button>
    </div>
    <div class="kpis kpis-detalle" id="d-kpis"></div>
    <div class="lienzo lienzo-bajo"><canvas id="g-detalle" role="img" aria-label="Llamadas del gestor por franja"></canvas></div>
    <div class="tabla-scroll"><table id="t-detalle" class="tabla"></table></div>
  </dialog>
</body>
</html>
