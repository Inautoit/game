# Cloudflare Workers: el juego son ficheros estáticos y el Worker sólo
# atiende /api/* y /room/* (salas por WebSocket).
#   npm run deploy   -> publica
#   npm run preview  -> servidor local en http://localhost:8000
#
# Qué NO se sube está en .assetsignore.
name = "urus-traffic"
main = "worker/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "."

[[d1_databases]]
binding = "DB"
database_name = "urus-traffic-db"
database_id = "fd062035-e781-47f0-b675-2f1c6ebddc15"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite es el único respaldo disponible en el plan gratuito.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
