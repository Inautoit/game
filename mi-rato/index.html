<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2b1b4f" />
  <meta name="description" content="Reels para la mente: música, preguntas fáciles y consejos de comida y salud." />
  <title>Mi Rato</title>
  <link rel="manifest" href="./manifest.webmanifest" />

  <script type="module" src="./app.js"></script>
