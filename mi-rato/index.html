<!DOCTYPE html>
<html lang="es">
<head>

  <title>Mi Rato</title>
  <link rel="manifest" href="./manifest.webmanifest" />

<body>
  <main id="feed" aria-live="polite"></main>

  <header id="top">

  <rect width="512" height="512" rx="112" fill="#1f5fd6"/>
  <circle cx="256" cy="262" r="150" fill="#fff"/>
  <path d="M222 192 L328 262 L222 332 Z" fill="#1f5fd6" stroke="#1f5fd6" stroke-width="22" stroke-linejoin="round"/>
  <path d="M398 92 l12 30 30 12 -30 12 -12 30 -12 -30 -30 -12 30 -12z" fill="#fff"/>
</svg><span>Mi Rato</span></div>
    <button id="mute" aria-label="Quitar sonido">🔊</button>

  <div id="start">
    <div class="logo"><svg viewBox="0 0 512 512" aria-hidden="true">
  <rect width="512" height="512" rx="112" fill="#1f5fd6"/>
  <circle cx="256" cy="262" r="150" fill="#fff"/>
  <path d="M222 192 L328 262 L222 332 Z" fill="#1f5fd6" stroke="#1f5fd6" stroke-width="22" stroke-linejoin="round"/>

</svg></div>
    <h1>Mi Rato</h1>

    <label for="name">¿Cómo te llamas? <small>(si quieres)</small></label>
    <input id="name" autocomplete="given-name" maxlength="20" placeholder="Tu nombre" />
    <button id="go">Entrar</button>
    <button id="test" type="button">🔊 Probar sonido</button>
    <p id="testmsg" class="testmsg"></p>
